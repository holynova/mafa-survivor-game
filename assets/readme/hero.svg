<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">玛法幸存者 Mafa Survivor — 传奇 1.76 三职业肉鸽幸存者：战士、法师、道士，12 波 15 分钟怪潮</title>
  <desc id="desc">暗红底传奇风标题：玛法幸存者；右侧是三张职业卡：战士利剑、法师火球、道士灵符，分别标注 6、14、13 项技能。</desc>

  <rect width="1200" height="360" rx="26" fill="#1a1210"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#c9a86a">传奇 1.76 · 三职业肉鸽幸存者 · ROGUELITE SURVIVOR</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#e8c97a">玛法幸存者</text>
    <text x="56" y="168" font-size="23" fill="#f2e9dc">MAFA SURVIVOR — 战法道三职业，12 波怪潮，15 分钟一局</text>
    <text x="56" y="204" font-size="19" fill="#c9a86a">33 项原版技能自由构筑流派，迎战骷髅精灵、尸王与沃玛教主。</text>
    <g id="chips" font-size="18" fill="#f2e9dc" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#2a1c16" stroke="#5a3a26" stroke-width="1.5"/><text x="119" y="262">33 项技能</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#2a1c16" stroke="#5a3a26" stroke-width="1.5"/><text x="257" y="262">7 章地图</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#2a1c16" stroke="#5a3a26" stroke-width="1.5"/><text x="395" y="262">39 种魔物</text></g>
      <g><rect x="470" y="238" width="126" height="36" rx="18" fill="#2a1c16" stroke="#5a3a26" stroke-width="1.5"/><text x="533" y="262">65 件装备</text></g>
    </g>
  </g>

  <g id="class-cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- warrior -->
    <g id="card-warrior">
      <rect x="752" y="52" width="124" height="220" rx="12" fill="#241612" stroke="#7a3a26" stroke-width="2"/>
      <g transform="translate(814 128)">
        <rect x="-6" y="-52" width="12" height="72" rx="3" fill="#d8dce2"/>
        <path d="M-6 -52 L0 -66 L6 -52 Z" fill="#d8dce2"/>
        <rect x="-20" y="20" width="40" height="8" rx="3" fill="#c9a86a"/>
        <rect x="-4" y="28" width="8" height="26" rx="3" fill="#8a6a2f"/>
        <circle cx="0" cy="60" r="6" fill="#c9a86a"/>
      </g>
      <text x="814" y="238" font-size="20" font-weight="700" fill="#f2e9dc" text-anchor="middle">战士</text>
      <text x="814" y="262" font-size="18" fill="#c9a86a" text-anchor="middle">6 项技能</text>
    </g>
    <!-- wizard -->
    <g id="card-wizard">
      <rect x="892" y="52" width="124" height="220" rx="12" fill="#141c2a" stroke="#2a4a7a" stroke-width="2"/>
      <g transform="translate(954 128)">
        <rect x="-4" y="-30" width="8" height="84" rx="3" fill="#8a6a2f"/>
        <circle cx="0" cy="-48" r="22" fill="#e86a2a"/>
        <circle cx="-6" cy="-52" r="12" fill="#f5a623"/>
        <circle cx="2" cy="-56" r="6" fill="#ffe08a"/>
        <path d="M-14 -30 Q0 -44 14 -30 Q0 -20 -14 -30 Z" fill="#e86a2a" opacity="0.7"/>
      </g>
      <text x="954" y="238" font-size="20" font-weight="700" fill="#f2e9dc" text-anchor="middle">法师</text>
      <text x="954" y="262" font-size="18" fill="#9db8d8" text-anchor="middle">14 项技能</text>
    </g>
    <!-- taoist -->
    <g id="card-taoist">
      <rect x="1032" y="52" width="124" height="220" rx="12" fill="#14211a" stroke="#2a6a3a" stroke-width="2"/>
      <g transform="translate(1094 128)">
        <rect x="-24" y="-56" width="48" height="72" rx="4" fill="#e8c97a"/>
        <rect x="-24" y="-56" width="48" height="10" rx="4" fill="#c9a86a"/>
        <path d="M-12 -34 L12 -34 M0 -40 L0 -8 M-12 -16 L12 -16" stroke="#a83232" stroke-width="3" stroke-linecap="round"/>
        <circle cx="0" cy="8" r="5" fill="#a83232"/>
        <rect x="-3" y="16" width="6" height="40" rx="3" fill="#8a6a2f"/>
      </g>
      <text x="1094" y="238" font-size="20" font-weight="700" fill="#f2e9dc" text-anchor="middle">道士</text>
      <text x="1094" y="262" font-size="18" fill="#9dc8a8" text-anchor="middle">13 项技能</text>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="954" y="316" font-size="18" fill="#c9a86a" text-anchor="middle">12 波 × 75 秒 · 第 12 波出 Boss</text>
  </g>
</svg>
